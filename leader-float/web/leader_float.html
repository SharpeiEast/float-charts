<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>盯盘 · 带单员动作</title>
<style>
:root{--bg:#0f1218;--panel:#151a22;--line:#262c38;--tx:#d4d8e0;--mut:#8a93a3;--up:#0ECB81;--dn:#F6465D;--acc:#f0b90b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.4 -apple-system,"Segoe UI","Noto Sans CJK SC","PingFang SC",sans-serif}
#app{display:flex;height:100vh}
#left{width:46%;min-width:470px;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel)}
#right{flex:1;display:flex;flex-direction:column;min-width:0}
.bar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
button{background:#1d2430;color:var(--tx);border:1px solid var(--line);border-radius:5px;padding:4px 9px;font:inherit;cursor:pointer}
button:hover{border-color:#3a4456}
button.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
.mut{color:var(--mut)}
.dd{position:relative}
#ddpanel{position:absolute;z-index:20;top:32px;left:0;width:390px;max-height:70vh;overflow:auto;background:#1a202b;border:1px solid #384256;border-radius:8px;padding:6px;box-shadow:0 8px 24px #0009}
#ddpanel label{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:5px;cursor:pointer}
#ddpanel label:hover{background:#232b39}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.sub{color:var(--mut);font-size:11px;margin-left:auto;text-align:right}
.err{color:var(--dn)}
#tablewrap{flex:1;overflow:auto}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:#1a202b;text-align:left;font-weight:500;color:var(--mut);padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 6px;border-bottom:1px solid #1d232e;white-space:nowrap}
tr.row{cursor:pointer}
tr.row:hover{background:#1c2330}
.num{text-align:right;font-variant-numeric:tabular-nums}
.long{color:var(--up)}.short{color:var(--dn)}
.tag{padding:1px 5px;border-radius:4px;background:#252d3b;font-size:11px}
#chartbox{flex:1;min-height:0;position:relative}
#chart{position:absolute;inset:0}
#price{font-variant-numeric:tabular-nums;font-weight:600}
@media (max-width:900px){#app{flex-direction:column-reverse}#left{width:100%;min-width:0;height:45vh}#right{height:55vh}}
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div class="bar">
      <div class="dd">
        <button id="ddbtn">盯盘对象 ▾</button>
        <div id="ddpanel" hidden></div>
      </div>
      <span id="status" class="mut"></span>
    </div>
    <div id="tablewrap">
      <table>
        <thead><tr><th>时间(东京)</th><th>交易员</th><th>币</th><th>动作</th><th class="num">数量</th><th class="num">均价</th><th class="num">名义</th><th class="num">杠杆</th><th class="num">已实现盈亏</th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </div>
  <div id="right">
    <div class="bar" id="toolbar"></div>
    <div id="chartbox"><div id="chart"></div></div>
  </div>
</div>
<script src="lwc.js"></script>
<script>
const TZOFF = 9 * 3600;                                    // chart axis shows Tokyo time
const IVS = {'1m':60,'3m':180,'5m':300,'15m':900,'30m':1800,'1h':3600,'4h':14400,'1d':86400};
const SYMN = {'ETHUSDT':'ETH','BTCUSDT':'BTC'};
let st = {inst:'ETHUSDT', iv:'5m', sel:null, hist:false};
try { Object.assign(st, JSON.parse(localStorage.getItem('lt_state') || '{}')); } catch (e) {}
function saveSt() { try { localStorage.setItem('lt_state', JSON.stringify({inst:st.inst, iv:st.iv, sel:st.sel})); } catch (e) {} }
let meta = null, bars = [], loadingMore = false, tableActions = [];

const $ = id => document.getElementById(id);
const fmtT = ms => new Intl.DateTimeFormat('zh-CN', {timeZone:'Asia/Tokyo', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false}).format(new Date(ms)).replace(/\//g, '-');
// served by the tracker itself (browser): same origin; inside the desktop app (file://): ?srv=<tracker address>
const SRV = (new URLSearchParams(location.search).get('srv') || (location.protocol.startsWith('http') ? '' : 'http://100.78.175.68:8780')).replace(/\/$/, '');
async function jget(u) { const r = await fetch(SRV + u); if (!r.ok) throw new Error(r.status); return r.json(); }

// ------------------------------------------------------------ chart
const chart = LightweightCharts.createChart($('chart'), {
  autoSize: true,
  layout: {background: {color: '#0f1218'}, textColor: '#c8ccd4'},
  grid: {vertLines: {color: '#1a1f29'}, horzLines: {color: '#1a1f29'}},
  rightPriceScale: {borderColor: '#2a303c'},
  timeScale: {borderColor: '#2a303c', timeVisible: true, secondsVisible: false},
});
const series = chart.addCandlestickSeries({upColor:'#0ECB81', downColor:'#F6465D', borderVisible:false, wickUpColor:'#0ECB81', wickDownColor:'#F6465D'});
const toBar = k => ({time: Math.floor(k[0] / 1000) + TZOFF, open: k[1], high: k[2], low: k[3], close: k[4]});
async function loadBars(endTime) {
  const u = `/api/klines?symbol=${st.inst}&interval=${st.iv}&limit=1000` + (endTime ? `&endTime=${endTime}` : '');
  return (await jget(u)).map(toBar);
}
async function reload() {
  st.hist = false;
  bars = await loadBars();
  series.setData(bars);
  const n = bars.length;
  chart.timeScale().setVisibleLogicalRange({from: Math.max(0, n - 140), to: n + 6});
  await refreshMarkers();
}
async function live() {
  if (st.hist) return;
  try {
    const k = await jget(`/api/klines?symbol=${st.inst}&interval=${st.iv}&limit=2`);
    for (const x of k) {
      const b = toBar(x);
      if (!bars.length || b.time >= bars[bars.length - 1].time) {
        if (bars.length && b.time === bars[bars.length - 1].time) bars[bars.length - 1] = b; else bars.push(b);
        series.update(b);
      }
    }
    if (bars.length) { const l = bars[bars.length - 1]; $('price').textContent = l.close.toLocaleString('en-US', {minimumFractionDigits: 2}); }
  } catch (e) {}
}
chart.timeScale().subscribeVisibleLogicalRangeChange(async r => {
  if (!r || loadingMore || !bars.length || r.from > 15) return;
  loadingMore = true;
  try {
    const first = bars[0].time - TZOFF;
    const more = await loadBars(first * 1000 - 1);
    if (more.length) {
      bars = more.concat(bars); series.setData(bars);
      chart.timeScale().setVisibleLogicalRange({from: r.from + more.length, to: r.to + more.length});
      await refreshMarkers();
    }
  } catch (e) {}
  loadingMore = false;
});
const snap = ms => { const s = IVS[st.iv] * 1000; return Math.floor(ms / s) * s; };
async function refreshMarkers() {
  if (!bars.length || !meta) return;
  if (!st.sel || !st.sel.length) { series.setMarkers([]); return; }
  const from = (bars[0].time - TZOFF) * 1000;
  let j;
  try { j = await jget(`/api/actions?inst=${st.inst}&traders=${st.sel.join(',')}&from=${from}&limit=5000`); } catch (e) { return; }
  const mk = [];
  for (const a of j.actions) {
    const t = meta.byId[a.trader]; if (!t) continue;
    const buy = (a.kind === 'open') === (a.dir === 'long');
    mk.push({time: Math.floor(snap(a.t0) / 1000) + TZOFF, position: buy ? 'belowBar' : 'aboveBar', color: t.color,
             shape: a.kind === 'open' ? (a.dir === 'long' ? 'arrowUp' : 'arrowDown') : 'circle',
             text: t.short + (a.kind === 'open' ? '开' : '平') + (a.dir === 'long' ? '多' : '空') + (a.src === 'pos' ? '*' : '')});
  }
  mk.sort((x, y) => x.time - y.time);
  series.setMarkers(mk);
}
async function gotoAction(a) {
  if (a.inst !== st.inst) { st.inst = a.inst; saveSt(); buildToolbar(); }
  st.hist = true;
  const ms = a.t0, iv = IVS[st.iv] * 1000;
  bars = await loadBars(Math.min(ms + iv * 80, Date.now()));
  series.setData(bars);
  const target = Math.floor(snap(ms) / 1000) + TZOFF;
  let i = bars.findIndex(b => b.time >= target); if (i < 0) i = bars.length - 1;
  chart.timeScale().setVisibleLogicalRange({from: i - 70, to: i + 30});
  await refreshMarkers();
}

// ------------------------------------------------------------ toolbar
function buildToolbar() {
  const tb = $('toolbar'); tb.innerHTML = '';
  for (const s of ['ETHUSDT', 'BTCUSDT']) {
    const b = document.createElement('button'); b.textContent = SYMN[s]; if (st.inst === s) b.className = 'on';
    b.onclick = async () => { st.inst = s; saveSt(); buildToolbar(); await reload(); await loadTable(); }; tb.appendChild(b);
  }
  const sp = document.createElement('span'); sp.style.width = '8px'; tb.appendChild(sp);
  for (const iv of Object.keys(IVS)) {
    const b = document.createElement('button'); b.textContent = iv; if (st.iv === iv) b.className = 'on';
    b.onclick = async () => { st.iv = iv; saveSt(); buildToolbar(); await reload(); }; tb.appendChild(b);
  }
  const nb = document.createElement('button'); nb.textContent = '最新 ▸'; nb.onclick = () => reload(); tb.appendChild(nb);
  const p = document.createElement('span'); p.id = 'price'; p.style.marginLeft = 'auto'; tb.appendChild(p);
}

// ------------------------------------------------------------ trader dropdown + table
function buildDropdown() {
  const pn = $('ddpanel'); pn.innerHTML = '';
  const top = document.createElement('div'); top.style.cssText = 'display:flex;gap:6px;padding:2px 4px 6px';
  const all = document.createElement('button'); all.textContent = '全选'; all.onclick = () => setSel(meta.traders.map(t => t.id));
  const none = document.createElement('button'); none.textContent = '清空'; none.onclick = () => setSel([]);
  top.appendChild(all); top.appendChild(none); pn.appendChild(top);
  for (const t of meta.traders) {
    const l = document.createElement('label');
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = st.sel.includes(t.id);
    cb.onchange = () => setSel(cb.checked ? st.sel.concat([t.id]) : st.sel.filter(x => x !== t.id));
    const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = t.color;
    const nm = document.createElement('span'); nm.textContent = t.name + (t.public_pos ? ' ◆' : '');
    const sb = document.createElement('span'); sb.className = 'sub' + (t.err ? ' err' : '');
    sb.innerHTML = t.err ? '采集出错' : `BTC/ETH ${t.fills_be} 笔<br>最近 ${t.last_fill ? fmtT(t.last_fill) : '-'}`;
    l.appendChild(cb); l.appendChild(dot); l.appendChild(nm); l.appendChild(sb); pn.appendChild(l);
  }
  $('ddbtn').textContent = `盯盘对象 (${st.sel.length}/${meta.traders.length}) ▾`;
}
async function setSel(ids) { st.sel = ids; saveSt(); buildDropdown(); await Promise.all([loadTable(), refreshMarkers()]); }
$('ddbtn').onclick = e => { $('ddpanel').hidden = !$('ddpanel').hidden; e.stopPropagation(); };
document.addEventListener('click', e => { if (!$('ddpanel').contains(e.target)) $('ddpanel').hidden = true; });

async function loadMeta() {
  try {
    meta = await jget('/api/meta'); meta.byId = {}; for (const t of meta.traders) meta.byId[t.id] = t;
    if (st.sel === null) st.sel = [meta.traders[0].id];
    st.sel = st.sel.filter(x => meta.byId[x]);
    if (!$('ddpanel').contains(document.activeElement)) buildDropdown();
    const tot = meta.traders.reduce((s, t) => s + t.fills, 0), errs = meta.traders.filter(t => t.err).length;
    const lastOk = Math.max(...meta.traders.map(t => t.last_ok || 0));
    $('status').innerHTML = `已存 ${tot.toLocaleString()} 笔成交 · 最近采集 ${lastOk ? fmtT(lastOk) : '-'}` + (errs ? ` · <span class="err">${errs} 个出错</span>` : '');
  } catch (e) { $('status').textContent = '连接服务失败'; }
}
async function loadTable() {
  if (!meta || !st.sel || !st.sel.length) { $('tb').innerHTML = '<tr><td colspan="9" class="mut" style="padding:16px">请在左上角「盯盘对象」里勾选要看的人</td></tr>'; tableActions = []; return; }
  try {
    const [a, b] = await Promise.all(['ETHUSDT', 'BTCUSDT'].map(s => jget(`/api/actions?inst=${s}&traders=${st.sel.join(',')}&limit=200`)));
    tableActions = a.actions.concat(b.actions).sort((x, y) => y.t1 - x.t1).slice(0, 400);
  } catch (e) { return; }
  const tb = $('tb'); tb.innerHTML = '';
  if (!tableActions.length) { tb.innerHTML = '<tr><td colspan="9" class="mut" style="padding:16px">所选的人暂时没有 BTC/ETH 的动作记录（采集器在后台继续下载）</td></tr>'; return; }
  for (const a of tableActions) {
    const t = meta.byId[a.trader]; const tr = document.createElement('tr'); tr.className = 'row';
    const lab = (a.kind === 'open' ? '开' : '平') + (a.dir === 'long' ? '多' : '空');
    const dec = a.inst === 'BTCUSDT' ? 3 : 2;
    const tm = a.t0 === a.t1 ? fmtT(a.t0) : fmtT(a.t0);
    tr.innerHTML = `<td>${tm}</td><td><span class="dot" style="background:${t.color}"></span> ${t.name}</td><td><span class="tag">${SYMN[a.inst]}</span></td>` +
      `<td class="${a.dir}">${lab}${a.src === 'pos' ? ' <span class="tag" title="仓位级记录：只有开仓/平仓时刻，没有逐笔加减仓">仓</span>' : ''}</td><td class="num">${a.qty.toLocaleString('en-US', {maximumFractionDigits: dec})}</td>` +
      `<td class="num">${a.price.toLocaleString('en-US', {maximumFractionDigits: 2})}</td><td class="num">${(a.notional / 1e4).toFixed(1)}万</td>` +
      `<td class="num">${a.lev ? a.lev + 'x' : '<span class="mut">-</span>'}</td>` +
      `<td class="num ${a.kind === 'close' ? (a.pnl >= 0 ? 'long' : 'short') : 'mut'}">${a.kind === 'close' ? (a.pnl >= 0 ? '+' : '') + Math.round(a.pnl).toLocaleString() : '-'}</td>`;
    tr.onclick = () => gotoAction(a);
    tb.appendChild(tr);
  }
}

// ------------------------------------------------------------ boot
(async () => {
  buildToolbar();
  await loadMeta();
  await reload();
  await loadTable();
  setInterval(live, 2000);
  setInterval(loadMeta, 30000);
  setInterval(async () => { await loadTable(); await refreshMarkers(); }, 15000);
})();
</script>
</body>
</html>
