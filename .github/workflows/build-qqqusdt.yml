name: build-qqqusdt

on:
  push:
    tags: ["qqqusdt-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: QQQUSDT-Float-windows
          - os: macos-15              # Apple silicon (M1/M2/M3...)
            artifact: QQQUSDT-Float-macos-arm64
          - os: macos-15-intel        # Intel Macs
            artifact: QQQUSDT-Float-macos-intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: qqqusdt-float
    continue-on-error: ${{ matrix.os == 'macos-15-intel' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name QQQUSDT-Float --add-data "web;web" app/main.py
          ls -la dist

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --name QQQUSDT-Float --add-data "web:web" app/main.py
          ls -la dist
          ditto -c -k --keepParent dist/QQQUSDT-Float.app dist/${{ matrix.artifact }}.zip

      - name: Smoke test (opens 3 windows, switches one, closes one, reads the pages)
        continue-on-error: true
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="dist/QQQUSDT-Float.exe"; else BIN="dist/QQQUSDT-Float.app/Contents/MacOS/QQQUSDT-Float"; fi
          "$BIN" --selftest selftest.json --spot &
          PID=$!
          for i in $(seq 1 150); do [ -f selftest.json ] && break; sleep 1; done
          cat selftest.json || echo "selftest produced no output"
          kill $PID 2>/dev/null || true

      - name: Control (macOS only), the plain smoke test a second time
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          BIN="dist/QQQUSDT-Float.app/Contents/MacOS/QQQUSDT-Float"
          sleep 5
          "$BIN" --selftest selftest_ctl.json --spot &
          PID=$!
          for i in $(seq 1 150); do [ -f selftest_ctl.json ] && break; sleep 1; done
          if [ -f selftest_ctl.json ]; then echo "CONTROL: output produced"; else echo "CONTROL: no output"; fi
          kill $PID 2>/dev/null || true

      - name: Smoke test, server mode (the page trades through simu_server.py)
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p srvtest
          echo ci > srvtest/token
          SIMU_TEST=1 SIMU_NO_BARK=1 python server/simu_server.py --host 127.0.0.1 --port 8765 --state srvtest/state.json --token-file srvtest/token --html web/qqqusdt_float.html > srvtest/server.log 2>&1 &
          SPID=$!
          sleep 3
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="dist/QQQUSDT-Float.exe"; else BIN="dist/QQQUSDT-Float.app/Contents/MacOS/QQQUSDT-Float"; fi
          pkill -f QQQUSDT-Float || true
          sleep 8
          "$BIN" --selftest selftest_srv.json --spot --srv http://127.0.0.1:8765 --tok ci &
          PID=$!
          for i in $(seq 1 200); do [ -f selftest_srv.json ] && break; sleep 1; done
          cat selftest_srv.json || echo "server selftest produced no output"
          echo; tail -5 srvtest/server.log
          kill $PID 2>/dev/null || true
          kill $SPID 2>/dev/null || true

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then cp dist/QQQUSDT-Float.exe "out/${{ matrix.artifact }}.exe"; else cp dist/${{ matrix.artifact }}.zip out/; fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: qqqusdt-float/out/*

      - name: Attach to the GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/qqqusdt-v')
        uses: softprops/action-gh-release@v2
        with:
          files: qqqusdt-float/out/*

  deb:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: qqqusdt-float
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-pip gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb xdotool

      - name: Build the .deb
        run: |
          VER="${GITHUB_REF_NAME#qqqusdt-v}"
          case "$GITHUB_REF" in refs/tags/qqqusdt-v*) ;; *) VER="0.0.0-ci" ;; esac
          bash ubuntu/build-deb.sh "$VER" out
          ls -la out

      - name: Install it and smoke test (virtual display)
        continue-on-error: true
        run: |
          sudo apt-get install -y ./out/*.deb
          export GDK_BACKEND=x11
          xvfb-run -a -s "-screen 0 1600x1000x24" qqqusdt-float --selftest selftest_deb.json --spot &
          PID=$!
          for i in $(seq 1 200); do [ -f selftest_deb.json ] && break; sleep 1; done
          cat selftest_deb.json || echo "deb selftest produced no output"
          kill $PID 2>/dev/null || true

      - name: Smoke test, server mode
        continue-on-error: true
        run: |
          mkdir -p srvtest
          echo ci > srvtest/token
          SIMU_TEST=1 SIMU_NO_BARK=1 python3 server/simu_server.py --host 127.0.0.1 --port 8765 --state srvtest/state.json --token-file srvtest/token --html web/qqqusdt_float.html > srvtest/server.log 2>&1 &
          SPID=$!
          sleep 3
          xvfb-run -a -s "-screen 0 1600x1000x24" qqqusdt-float --selftest selftest_deb_srv.json --spot --srv http://127.0.0.1:8765 --tok ci &
          PID=$!
          for i in $(seq 1 200); do [ -f selftest_deb_srv.json ] && break; sleep 1; done
          cat selftest_deb_srv.json || echo "deb server selftest produced no output"
          echo; tail -5 srvtest/server.log
          kill $PID 2>/dev/null || true
          kill $SPID 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: qqqusdt-float-deb
          path: qqqusdt-float/out/*.deb

      - name: Attach to the GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/qqqusdt-v')
        uses: softprops/action-gh-release@v2
        with:
          files: qqqusdt-float/out/*.deb
