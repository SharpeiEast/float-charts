<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QQQUSDT / ETH / BTC 实时蜡烛图</title>
<style id="css">
  :root { --bg:#10151c; --panel:#161c25; --fg:#d7dde5; --muted:#8793a1; --line:#273140; --accent:#3b82f6; --up:#2ebd6b; --dn:#e5534b; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif; overflow:hidden; }
  #app { display:flex; flex-direction:row; width:100vw; height:100vh; background:var(--bg); }
  #col { display:flex; flex-direction:column; flex:1; min-width:0; min-height:0; }
  #hdr { display:flex; align-items:center; gap:10px; padding:6px 10px; background:var(--panel); border-bottom:1px solid var(--line); font-size:13px; white-space:nowrap; overflow:hidden; flex-wrap:wrap; row-gap:4px; }
  .lb { color:var(--muted); font-size:12px; margin-right:-4px; }
  .num { font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; }
  .num.stale { opacity:0.45; }
  #hdr { gap:8px; }
  @media (max-width: 640px) { #hdr { gap:6px; font-size:12px; } button { padding:2px 5px; } .num { font-size:16px; } }
  #dot, #ydot { width:9px; height:9px; border-radius:50%; background:#777; flex:none; }
  .sp { flex:1; }
  button { font:inherit; padding:2px 9px; border:1px solid var(--line); background:transparent; color:var(--fg); border-radius:5px; cursor:pointer; }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  label { cursor:pointer; user-select:none; color:var(--muted); display:flex; align-items:center; gap:3px; }
  #wrap { position:relative; flex:1; min-height:0; }
  #cv { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }
  select { font:inherit; padding:2px 4px; border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius:5px; color-scheme:dark; }
  select option { background:var(--panel); color:var(--fg); }
  #toast { position:absolute; right:10px; top:44px; background:#2b3646; color:var(--fg); padding:4px 10px; border-radius:5px; font-size:12px; display:none; z-index:5; }
  #tbtn.pos { color:var(--up); border-color:var(--up); } #tbtn.neg { color:var(--dn); border-color:var(--dn); }
  #tp { display:none; flex:none; width:250px; box-sizing:border-box; background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; padding:8px 10px 10px; font-size:12px; }
  #tp.open { display:block; }
  #tp .h { display:flex; align-items:center; gap:6px; margin-bottom:6px; } #tp .h b { font-size:13px; }
  #tp .r { display:flex; align-items:center; gap:6px; margin:5px 0; } #tp .r > span.k { color:var(--muted); width:44px; flex:none; }
  #tp input[type=number], #tp input[type=text] { width:0; flex:1; min-width:0; font:inherit; padding:2px 4px; border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius:5px; }
  #tp input[type=range] { flex:1; min-width:0; }
  #tp .hint { color:var(--muted); font-size:11px; min-width:52px; text-align:right; }
  #tp .two { display:flex; gap:6px; } #tp .two button { flex:1; padding:4px 0; }
  #tp button.buy.on { background:var(--up); border-color:var(--up); } #tp button.put.on { background:var(--dn); border-color:var(--dn); }
  #tp .go { width:100%; padding:6px 0; margin-top:6px; font-weight:700; border-color:var(--accent); } #tp .go.stop { border-color:var(--dn); }
  #tp .big { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; margin:2px 0 4px; }
  #tp .kv { display:flex; justify-content:space-between; margin:3px 0; } #tp .kv span:first-child { color:var(--muted); }
  #tp .card { border:1px solid var(--line); border-radius:6px; padding:5px 8px 7px; margin-bottom:8px; } #tp .card.cur { border-color:var(--accent); }
  #tp .card .ch { display:flex; align-items:center; gap:6px; cursor:pointer; } #tp .card .ch b { font-size:13px; } #tp .card .big { font-size:20px; margin:0 0 2px; } #tp .card .go { margin-top:4px; padding:4px 0; }
  #tp .card .kv b { font-weight:600; font-variant-numeric:tabular-nums; } #tp .card .r { margin:4px 0; } #tp #tp-form { border-top:1px solid var(--line); padding-top:6px; }
  #tp .card .cw:empty { display:none; }
  #tp button:disabled { opacity:0.45; cursor:default; }
  #tp .warn { color:#e0a030; font-size:11px; min-height:14px; margin-top:4px; }
  #tp .two + .two { margin-top:5px; }
  .up { color:var(--up); } .dn { color:var(--dn); }
  #msg { position:absolute; left:10px; bottom:26px; font-size:12px; color:var(--muted); pointer-events:none; }
  /* six-period view: ?grid=1 is the host (one window, six iframes); every cell is this same page with ?cell=1 */
  #celltf { display:none; font-weight:700; color:var(--accent); }
  body.cell #celltf { display:inline; }
  body.cell #inst, body.cell #qpx, body.cell #ydot, body.cell #tfs, body.cell #bb, body.cell #tbtn, body.cell #pip, body.cell #add, body.cell #gridbtn, body.cell #tp { display:none !important; }
  body.cell #hdr .sp { display:none; } body.cell #hdr { padding:2px 8px; font-size:12px; flex-wrap:nowrap; } body.cell #px, body.cell #dot { display:none !important; }
  #gcells { display:none; position:absolute; inset:0; grid-template-columns:repeat(3, minmax(0, 1fr)); grid-template-rows:repeat(2, minmax(0, 1fr)); gap:2px; overflow:hidden; background:var(--line); }
  #bibtn { display:none; } body.six #bibtn { display:inline-block; } body.cell #bibtn { display:none !important; }
  body.bi #gcells { grid-template-columns:repeat(3, minmax(0, 1fr)); grid-template-rows:repeat(2, minmax(0, 1fr)); }   /* Bi Coin: BTC 1h 1d 1w on top, ETH below, in every window shape */
  body.six #gcells { display:grid; } body.six #cv, body.six #msg, body.six #tfs { display:none !important; }
  @media (max-aspect-ratio: 1/1) { #gcells { grid-template-columns:repeat(2, minmax(0, 1fr)); grid-template-rows:repeat(3, minmax(0, 1fr)); } }
  .gc { position:relative; min-width:0; min-height:0; overflow:hidden; background:var(--bg); }
  .gc iframe { position:absolute; left:0; top:0; width:100%; height:100%; border:0; display:block; }   /* sized by the cell, never by the iframe's own height (WebKit let the rows grow past the window) */
</style>
</head>
<body>
<div id="holder" style="display:none;padding:24px;color:#8793a1;font:14px sans-serif">浮窗已打开。关闭浮窗后图表会回到这里。</div>
<div id="app">
  <div id="col">
  <div id="hdr">

  </div>
  <div id="tp">
    <div class="h"><b>模拟合约</b><span class="sp"></span><span id="tppx" class="lb"></span><button id="tpcfg" title="服务器设置">⚙</button><button id="tpx" title="收起">✕</button></div>

      <div id="sumrecbox">
        <input id="sumnote" type="text" maxlength="500" placeholder="复盘备注 (可选)" style="width:100%;box-sizing:border-box;margin-top:8px">

      <div class="two"><button id="tpmkt" class="on" title="按现价立即开仓">市价</button><button id="tplmt" title="设好价位, 价格到了才开仓">限价</button></div>
      <div class="two"><button id="tpbuy" class="buy on" title="Buy: 价格上涨赚钱">Buy 做多</button><button id="tpput" class="put" title="Put: 价格下跌赚钱">Put 做空</button></div>
      <div class="r" id="tp-lr1" style="display:none"><span class="k">限价</span><input type="text" id="tplp" placeholder="到此价开仓" inputmode="decimal"><span class="hint" id="tplph"></span></div>
      <div class="r" id="tp-lr2" style="display:none"><span class="k">有效期</span><input type="number" id="tpexp" min="1" max="1440" step="1" placeholder="默认30"><span>分钟</span></div>

      <div class="r"><span class="k">地址</span><input type="text" id="tpsurl" placeholder="http://100.78.175.68:8765" autocapitalize="off" spellcheck="false"></div>
      <div class="r"><span class="k">口令</span><input type="text" id="tpstok" placeholder="访问口令" autocapitalize="off" spellcheck="false"></div>
      <button id="tpsok" class="go">保存并连接</button>

<script>
(function () { if (new URLSearchParams(location.search).has("cell")) document.body.classList.add("cell"); })();
</script>
<script>
"use strict";
const Q = new URLSearchParams(location.search);
const CELL = Q.has("cell");
function store(k, v) { try { if (v !== undefined && CELL) return; if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
const MARKETS = {
  perp: { sym: "QQQUSDT", label: "QQQUSDT 永续", short: "QQQUSDT", tag: "永续", rest: "https://fapi.binance.com/fapi/v1/klines", px: "https://fapi.binance.com/fapi/v1/ticker/price", ws: "wss://fstream.binance.com/market/stream" },
  spot: { sym: "QQQBUSDT", label: "QQQBUSDT 现货", short: "QQQBUSDT", tag: "现货", rest: "https://data-api.binance.vision/api/v3/klines", px: "https://data-api.binance.vision/api/v3/ticker/price", ws: "wss://data-stream.binance.vision/stream" }
};
const BN = MARKETS[Q.get("market")] || MARKETS.perp;
const MAX_WINS = 3;
// selectable instruments, all on Binance (QQQUSDT also shows the Yahoo QQQ price next to it); with ?market=spot the spot symbols are used
const SPOT = BN === MARKETS.spot;
const INSTS = {
  qqq: { label: "QQQ", sym: BN.sym, short: BN.short, title: "QQQUSDT" },
  eth: { label: "ETH Perps", sym: "ETHUSDT", short: "ETHUSDT", title: "ETH 永续" },
  btc: { label: "BTC Perps", sym: "BTCUSDT", short: "BTCUSDT", title: "BTC 永续" }
};
let inst = INSTS[Q.get("inst")] ? Q.get("inst") : (INSTS[store("inst")] ? store("inst") : "qqq");
const MK = BN;   // Binance endpoints (perpetual or spot)
const MOCK = Q.has("mock");
const TFS = ["3m", "5m", "15m", "30m", "1h", "4h", "1d", "1w", "1M"];
const TF_TIP = { "3m": "3 分钟", "5m": "5 分钟", "15m": "15 分钟", "30m": "30 分钟", "1h": "1 小时", "4h": "4 小时", "1d": "日K线", "1w": "周K线", "1M": "月K线" };
const TF_MS = { "3m": 18e4, "5m": 3e5, "15m": 9e5, "30m": 18e5, "1h": 36e5, "4h": 144e5, "1d": 864e5, "1w": 6048e5, "1M": 2592e6 };
const NB = 20, KB = 2;
const $ = id => document.getElementById(id);
const app = $("app"), cv = $("cv"), ctx = cv.getContext("2d");

let tf = TFS.includes(Q.get("tf")) ? Q.get("tf") : (TFS.includes(store("tf")) ? store("tf") : "1h");
let bbOn = store("bb") !== "0";
let candles = [], bands = [], ticker = null, tickerAt = 0, view = { n: 90, off: 0 }, hover = null;
let ws = null, gen = 0, lastMsg = 0, status = "init", pollTimer = null, wd = null;

Object.keys(INSTS).forEach(k => { const o = document.createElement("option"); o.value = k; o.textContent = INSTS[k].label; $("inst").appendChild(o); });
$("inst").value = inst;
$("bb").classList.toggle("on", bbOn);
$("celltf").textContent = (Q.has("bi") ? ({ btc: "BTC", eth: "ETH" }[inst] || "") + " · " : "") + TF_TIP[tf];
TFS.forEach(t => { const b = document.createElement("button"); b.textContent = t; b.dataset.tf = t; b.title = TF_TIP[t]; if (t === tf) b.className = "on"; b.onclick = () => setTf(t); $("tfs").appendChild(b); });
$("bb").onclick = () => { bbOn = !bbOn; $("bb").classList.toggle("on", bbOn); store("bb", bbOn ? "1" : "0"); render(); };
window.addEventListener("storage", e => { if (e.key === "bb") { bbOn = e.newValue !== "0"; $("bb").classList.toggle("on", bbOn); render(); } });   // other windows of the app
function toast(t) { const el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", 2500); }
function reportState() { if (CELL) return; try { if (window.pywebview && pywebview.api && pywebview.api.set_state) pywebview.api.set_state(inst, tf, btnRefresh.title || INSTS[inst].title); } catch (e) {} }
function setInst(k) {
  if (!INSTS[k]) return;
  inst = k; store("inst", k); view.off = 0; candles = []; bands = []; ticker = null;
  $("inst").value = k;
  $("qpx").style.display = $("ydot").style.display = k === "qqq" ? "" : "none";
  $("px").textContent = "--"; $("px").title = "币安 " + INSTS[k].short + " 最新价";
  document.title = INSTS[k].title; btnRefresh.title = null;
  if (CELL) { /* no Yahoo, no trading in the six-period cells */ } else if (k === "qqq") { if (!yws && !MOCK) connectYahoo(); } else { stopYahoo(); }
  reportState(); btnRefresh();
  if (six) { if (bi && k === "qqq") setBi(false); else if (!bi) sixLoad(); }          // Bi Coin keeps its two coins whichever of BTC / ETH is picked; QQQ goes back to QQQ's six periods
  if ((SRV || (!pos && !ord)) && tInst !== k) { tInst = k; $("tpi").value = k; clampLev(); if (SRV && LASTST) srvApply(LASTST); if (tOpen) { feedStart(k); hints(); } }   // and the panel follows the chart (each instrument keeps its own position / order)
  start();
}
$("inst").onchange = () => setInst($("inst").value);

function setStatus(s, text) {
  status = s;
  $("dot").style.background = s === "live" ? "#2ebd6b" : s === "poll" ? "#e0a030" : s === "connecting" ? "#6a7683" : "#e5534b";
  $("dot").title = text || s;
  $("msg").textContent = (s === "live" || s === "init") ? "" : (text || "");
}
function setTf(t) {
  tf = t; store("tf", t); view.off = 0; reportState();
  document.querySelectorAll("#tfs button").forEach(b => b.classList.toggle("on", b.dataset.tf === t));
  start();
}

// ---------- six-period view: six cells (this same page with ?cell=1) inside the chart area; the SIMU panel stays usable ----------
const SIXTF = ["3m", "5m", "15m", "30m", "1h", "4h"];
let six = false, sixFrames = [], cellSim = { poss: {}, ords: {} };
let bi = false;
const BI_CELLS = [["btc", "1h"], ["btc", "1d"], ["btc", "1w"], ["eth", "1h"], ["eth", "1d"], ["eth", "1w"]];
function sixSrc(i, t) { const u = new URLSearchParams(location.search); ["grid", "srv", "tok", "tf", "inst", "cell", "local", "bi"].forEach(k => u.delete(k)); u.set("inst", i); u.set("tf", t); u.set("cell", "1"); u.set("local", "1"); if (bi) u.set("bi", "1"); return location.pathname + "?" + u.toString(); }
function sixLoad() { sixFrames.forEach((f, n) => { f.src = six ? (bi ? sixSrc(BI_CELLS[n][0], BI_CELLS[n][1]) : sixSrc(inst, SIXTF[n])) : "about:blank"; }); }
function setBi(on) {
  if (CELL || bi === on) return;
  bi = on; document.body.classList.toggle("bi", on); $("bibtn").classList.toggle("on", on);
  if (on && inst === "qqq") { bi = on; setInst("btc"); }     // the drop-down on the left must show a coin that is on screen
  sixLoad();
}
$("bibtn").onclick = () => setBi(!bi);
function setSix(on) {
  if (CELL) return;
  if (!on && bi) { bi = false; document.body.classList.remove("bi"); $("bibtn").classList.remove("on"); }
  six = on; document.body.classList.toggle("six", on); $("gridbtn").textContent = on ? "Single" : "Six";
  if (!sixFrames.length) SIXTF.forEach(t => { const d = document.createElement("div"); d.className = "gc"; const f = document.createElement("iframe"); f.title = t; d.appendChild(f); $("gcells").appendChild(d); sixFrames.push(f); });
  sixLoad();
  try { if (window.pywebview && pywebview.api && pywebview.api.set_grid) pywebview.api.set_grid(on); } catch (e) {}
  setTimeout(render, 50);
}
function sixPush() {   // the cells have no trading of their own: they get the position / order lines and the Bollinger switch from this page
  if (!six) return;
  const m = { simu: { poss: SRV ? POS : (pos ? { [pos.inst]: pos } : {}), ords: SRV ? ORD : (ord ? { [ord.inst]: ord } : {}) }, bb: bbOn };      // every instrument's lines: the Bi Coin cells show two coins
  sixFrames.forEach(f => { try { f.contentWindow.postMessage(m, "*"); } catch (e) {} });
}
if (CELL) window.addEventListener("message", e => {
  const d = e.data; if (!d || !d.simu) return;
  const k = JSON.stringify(d); if (k === sixPush.last) return; sixPush.last = k;
  cellSim = d.simu; if (bbOn !== d.bb) { bbOn = d.bb; $("bb").classList.toggle("on", bbOn); } render();
});
else setInterval(sixPush, 500);
$("gridbtn").onclick = () => setSix(!six);

// ---------- data ----------
function parseK(a) { return { t: a[0], o: +a[1], h: +a[2], l: +a[3], c: +a[4], v: +a[5] }; }
function recomputeBands() {
  bands = new Array(candles.length);
  for (let i = 0; i < candles.length; i++) {
    if (i < NB - 1) { bands[i] = null; continue; }
    let s = 0, s2 = 0;
    for (let j = i - NB + 1; j <= i; j++) { const c = candles[j].c; s += c; s2 += c * c; }
    const m = s / NB, sd = Math.sqrt(Math.max(s2 / NB - m * m, 0));
    bands[i] = { m, u: m + KB * sd, l: m - KB * sd };
  }
}
function applyKline(k) {          // k: {t,o,h,l,c,v}
  const last = candles[candles.length - 1];
  if (last && last.t === k.t) candles[candles.length - 1] = k;
  else if (!last || k.t > last.t) { candles.push(k); if (candles.length > 1500) candles.shift(); }
  else return;
  recomputeBands();
}
async function fetchKlines(limit) {
  const u = MK.rest + "?symbol=" + INSTS[inst].sym + "&interval=" + tf + "&limit=" + limit;
  const r = await fetch(u);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return (await r.json()).map(parseK);
}

function closeWs() { if (ws) { ws.onopen = ws.onmessage = ws.onerror = ws.onclose = null; try { ws.close(); } catch (e) {} ws = null; } }
async function start() {
  const my = ++gen;
  closeWs(); clearInterval(pollTimer); clearInterval(wd);
  setStatus("connecting", "加载历史K线…");
  if (MOCK) { mockStart(my); return; }
  try {
    candles = await fetchKlines(500);
    if (my !== gen) return;
    recomputeBands(); render();
  } catch (e) { if (my !== gen) return; setStatus("err", "历史K线加载失败: " + e.message + " (3秒后重试)"); setTimeout(() => { if (my === gen) start(); }, 3000); return; }

function feedStop() { if (SRV) return; clearInterval(feed.poll); if (feed.ws) { feed.ws.onmessage = feed.ws.onclose = feed.ws.onerror = null; try { feed.ws.close(); } catch (e) {} } feed = { ws: null, sym: null, price: null, at: 0, poll: null }; }

  const px = priceOf(k, null), d = o.price >= 1000 ? 1 : 2, $c = s => c.querySelector(s);
  $c(".cd").textContent = INSTS[k].label + " " + sideName(o.side) + " " + o.lev + "x";
  const left = Math.max(0, Math.round((o.expAt - Date.now() - skew) / 1000));
  $c(".cot").textContent = "挂单 " + pad2(Math.floor(left / 60)) + ":" + pad2(left % 60);
  if (px != null) { $c(".onow").textContent = fmt(px, d); const dist = (o.price / px - 1) * 100; $c(".odist").textContent = (dist >= 0 ? "+" : "") + dist.toFixed(2) + "%"; }
  $c(".okind").textContent = o.kind === "stop" ? "突破" : o.kind === "limit" ? "回落/反弹" : "现价";
  setVal($c(".oprice"), fmt(o.price, d)); setVal($c(".olev"), o.lev); setVal($c(".omin"), o.mins); setVal($c(".otp"), o.tp ? o.tp : ""); setVal($c(".osl"), o.sl ? o.sl : "");
  const lq = liqOf({ inst: k, side: o.side, lev: o.lev, entry: o.price, fee: o.fee, fo: o.kind === "limit" ? MAKER : TAKER }), w = $c(".cw");
  w.textContent = c._msg || ("成交后爆仓价约 " + fmt(lq, d) + ", 超时自动撤单"); w.style.color = c._msg ? "var(--dn)" : "";
  cardHints(c);
}
function cardHints(c) {                          // expected return on margin if take-profit / stop-loss fills, fees included (the position's own fee setting); follows what is typed in the field
  const k = c.dataset.inst, q = getPos(k), o = q ? null : getOrd(k), b = q || o; if (!b) return;
  const entry = q ? q.entry : o.price, ref = q || { side: o.side, lev: o.lev, entry, fee: o.fee, fo: o.kind === "limit" ? MAKER : TAKER };
  const one = (inp, hint, kind) => {
    const v = pnum(inp), h = c.querySelector(hint);
    if (!v) { h.textContent = ""; h.className = "hint " + hint.slice(1); return; }
    const ok = kind === "tp" ? (b.side > 0 ? v > entry : v < entry) : (b.side > 0 ? v < entry : v > entry);
    if (!ok) { h.textContent = (b.side > 0 === (kind === "tp") ? "须高于" : "须低于") + (q ? "开仓价" : "限价"); h.className = "hint dn " + hint.slice(1); return; }
    const r = roeAt(v, ref); h.textContent = pc(r, 1); h.className = "hint " + (r >= 0 ? "up " : "dn ") + hint.slice(1);
    h.title = ref.fee ? "含开平仓手续费 (杠杆 x 费率), 不含资金费" : "未含手续费";
  };
  if (q) { one(c.querySelector(".ptp"), ".ptph", "tp"); one(c.querySelector(".psl"), ".pslh", "sl"); }
  else { one(c.querySelector(".otp"), ".otph", "tp"); one(c.querySelector(".osl"), ".oslh", "sl"); }
}
$("tp-cards").addEventListener("input", e => { const c = cardOf(e.target); if (c) cardHints(c); });
const cardOf = el => el.closest(".card");
function cardMsg(c, m) { c._msg = m || ""; renderCards(); }
function editLevel(c, which, el) {              // take-profit / stop-loss of an open position
  const k = c.dataset.inst, q = getPos(k); if (!q) return;
  const v = pnum(el), p = priceOf(k, q);
  if (SRV) return void srvDo("/api/pos/edit", { inst: k, [which]: el.value.trim() === "" ? null : el.value }, m => cardMsg(c, m)).then(ok => ok && cardMsg(c, ""));
  if (el.value.trim() === "") { q[which] = null; cardMsg(c, ""); scheduleRender(); return; }
  const ok = v && (which === "tp" ? (q.side > 0 ? v > p : v < p) : (q.side > 0 ? v < p : v > p));
  if (!ok) { cardMsg(c, (which === "tp" ? "止盈" : "止损") + "价需在现价" + ((which === "tp") === (q.side > 0) ? "上方" : "下方")); return; }
  q[which] = v; cardMsg(c, ""); scheduleRender();
}
function editOrder(c, field, el) {              // limit price / leverage / take-profit / stop-loss / countdown of a pending order
  const k = c.dataset.inst, o = getOrd(k); if (!o) return;
  const bad = m => { c._msg = m; c.querySelector(".cw").textContent = m; c.querySelector(".cw").style.color = "var(--dn)"; setTimeout(() => { c._msg = ""; }, 4000); };
  const body = { inst: k };
  if (field === "price") { const v = pnum(el); if (!v) return bad("限价无效"); body.price = v; }
  else if (field === "lev") { const v = Math.round(Number(el.value)); if (!(v >= 1)) return bad("杠杆至少 1 倍"); body.lev = v; }
  else if (field === "mins") { const m = Number(el.value); if (!(m >= 1 && m <= 1440)) return bad("倒计时需在 1 到 1440 分钟之间"); body.mins = m; }
  else body[field] = el.value.trim() === "" ? null : el.value;
  if (SRV) return void srvDo("/api/order/edit", body, bad).then(ok => ok && cardMsg(c, ""));
  if (field === "price") {
    const v = body.price;
    if (o.tp && (o.side > 0 ? o.tp <= v : o.tp >= v)) return bad("新限价与止盈价冲突, 请先改止盈价");
    if (o.sl && (o.side > 0 ? o.sl >= v : o.sl <= v)) return bad("新限价与止损价冲突, 请先改止损价");
    o.price = v; if (feed.price != null) o.kind = kindOf(o.side, v, feed.price);
  } else if (field === "lev") { const mx = TR[o.inst].max; o.lev = Math.min(mx, body.lev); if (body.lev > mx) bad("最大杠杆 " + mx + "x, 已改为 " + mx + "x"); }
  else if (field === "mins") { o.mins = body.mins; o.expAt = Date.now() + body.mins * 60000; }
  else {
    const v = pnum(el);
    if (el.value.trim() === "") o[field] = null;
    else {
      const ok = v && (field === "tp" ? (o.side > 0 ? v > o.price : v < o.price) : (o.side > 0 ? v < o.price : v > o.price));
      if (!ok) return bad((field === "tp" ? "止盈" : "止损") + "价需在限价" + ((field === "tp") === (o.side > 0) ? "上方" : "下方"));
      o[field] = v;
    }
  }
  renderCards(); scheduleRender(); if (feed.price != null) checkOrder(feed.price);
}
$("tp-cards").addEventListener("change", e => {
  const c = cardOf(e.target), cl = e.target.classList; if (!c) return;
  if (cl.contains("ptp")) editLevel(c, "tp", e.target); else if (cl.contains("psl")) editLevel(c, "sl", e.target);
  else if (cl.contains("oprice")) editOrder(c, "price", e.target); else if (cl.contains("olev")) editOrder(c, "lev", e.target);
  else if (cl.contains("omin")) editOrder(c, "mins", e.target); else if (cl.contains("otp")) editOrder(c, "tp", e.target); else if (cl.contains("osl")) editOrder(c, "sl", e.target);
});
$("tp-cards").addEventListener("click", e => {
  const c = cardOf(e.target); if (!c) return;
  const k = c.dataset.inst, cl = e.target.classList;
  if (cl.contains("pend")) { if (SRV) srvDo("/api/pos/close", { inst: k }, m => cardMsg(c, m)); else { const q = getPos(k); if (q) closePos("手动平仓", feed.price != null ? feed.price : q.last); } }
  else if (cl.contains("cancel")) { if (SRV) srvDo("/api/order/cancel", { inst: k }, m => cardMsg(c, m)); else { ord = null; if (!pos && !tOpen) feedStop(); renderCards(); scheduleRender(); } }
  else if (e.target.closest(".ch") && k !== inst) setInst(k);        // click a card's title: show that instrument's chart
});

function closePos(why, px) {                    // local mode
  const q = pos; pos = null;
  const liq = why === "爆仓";
  const roe = liq ? -1 : roeAt(px, q);
  renderSummary({ why, inst: q.inst, side: q.side, lev: q.lev, how: q.how, entry: q.entry, px, fee: q.fee, roe, liq,
    move: q.side * (px / q.entry - 1), fees: liq || !q.fee ? 0 : -q.lev * (foOf(q) + TAKER * px / q.entry),
    dur: Date.now() - q.t0, hi: Math.max(q.hi, roe), lo: Math.min(q.lo, roe) });
  renderCards(); scheduleRender();
}
function renderSummary(s) {
  const q = s, why = s.why, px = s.px, liq = s.liq, roe = s.roe, move = s.move, fees = s.fees;
  const d = q.entry >= 1000 ? 1 : 2, row = (a, b) => '<div class="kv"><span>' + a + "</span><span>" + b + "</span></div>";
  $("sumwhy").textContent = why;
  const e = $("sumroe"); e.textContent = pc(roe); e.className = "big " + (roe >= 0 ? "up" : "dn");
  $("sumrows").innerHTML =
    row("品种 / 方向", INSTS[q.inst].label + " · " + sideName(q.side)) + row("杠杆", q.lev + "x") + row("开仓方式", q.how || "市价") +
    row("开仓价", fmt(q.entry, d)) + row("平仓价", fmt(px, d)) +
    row("价格变动 (按方向)", '<span class="' + (move >= 0 ? "up" : "dn") + '">' + pc(move, 3) + "</span>") +
    row("本金收益率", '<span class="' + (roe >= 0 ? "up" : "dn") + '">' + pc(roe) + (q.fee ? " (含手续费)" : "") + "</span>") +
    (q.fee ? row("其中手续费", liq ? "已计入爆仓" : pc(fees)) : "") +
    row("持仓时长", dur(s.dur)) +
    row("期间最高 / 最低收益", '<span class="up">' + pc(s.hi) + '</span> / <span class="dn">' + pc(s.lo) + "</span>") +
    (liq ? row("说明", "保证金亏光, 本金全损") : "");
  $("sumrecbox").style.display = SRV ? "" : "none"; $("sumok").textContent = SRV ? "不记录" : "确定";
  $("sumnote").value = ""; $("sumwarn").textContent = "";
  $("tp-sum").style.display = ""; showView("main"); setTrade(true); $("tp").scrollTop = 0; btnRefresh(); scheduleRender();
}
$("sumrec").onclick = () => sumDone(true);
$("sumok").onclick = () => sumDone(false);
async function sumDone(keep) {
  if (SRV) { srvSeen = null; try { srvApply(await api("POST", "/api/ack", keep ? { keep: true, note: $("sumnote").value.trim() } : {})); } catch (e) { $("sumwarn").textContent = keep ? "记录失败: 服务器连不上或写入出错, 这次总结还在, 可重试" : "服务器连不上"; return; } }
  if (!SRV || !LASTST || !LASTST.sums.length) $("tp-sum").style.display = "none";
  hints(); renderCards();
}

function drawPos(UP, DN, FG, MUT, yOf, L, pw, T, ph) {
  const P = CELL ? (cellSim.poss[inst] || null) : pos, OD = CELL ? (cellSim.ords[inst] || null) : ord;
  const o = P && P.inst === inst ? P : null, w = !P && OD && OD.inst === inst ? OD : null;
  if (!o && !w) return;
  const d = (o ? o.entry : w.price) >= 1000 ? 1 : 2;
  const items = o ? [["入场", o.entry, FG, [6, 3]], ["止盈", o.tp, UP, [2, 3]], ["止损", o.sl, DN, [2, 3]], ["爆仓", o.liq, "#e0a030", [1, 3]]]
                  : [["挂单", w.price, "#5b8cff", [6, 3]], ["止盈", w.tp, UP, [2, 3]], ["止损", w.sl, DN, [2, 3]]];
  ctx.textAlign = "left"; ctx.textBaseline = "bottom";   // position labels sit at the left edge: the right side already carries the price tags
  for (const [name, v, col, dash] of items) {
    if (v == null) continue;
    const y = yOf(v); if (y < T || y > T + ph) continue;
    ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(L, Math.round(y) + 0.5); ctx.lineTo(L + pw, Math.round(y) + 0.5); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = col; ctx.fillText(name + " " + fmt(v, d), L + 4, y - 2);
  }
}
$("tpcfg").onclick = () => { $("tpsurl").value = SRV ? SRV.url : ""; $("tpstok").value = SRV ? SRV.tok : ""; $("tpswarn").textContent = ""; showView("set"); setTrade(true); };
$("tpsback").onclick = () => showView("main");
$("tpsok").onclick = async () => {
  const url = $("tpsurl").value.trim().replace(/\/+$/, ""), tok = $("tpstok").value.trim();
  if (url) {
    try { await (await fetch(url + "/api/ping")).json(); } catch (e) { $("tpswarn").textContent = "连不上这个地址, 检查地址和 Tailscale"; return; }
    try { const r = await fetch(url + "/api/state", { headers: { "X-Token": tok } }); if (r.status === 401) { $("tpswarn").textContent = "口令不对"; return; } } catch (e) { $("tpswarn").textContent = "连不上这个地址"; return; }
  }
  store("srv", url); store("tok", tok);
  try { if (window.pywebview && pywebview.api && pywebview.api.set_server) await pywebview.api.set_server(url, tok); } catch (e) {}
  const u = new URL(location.href); u.searchParams.delete("local"); if (url) { u.searchParams.set("srv", url); u.searchParams.set("tok", tok); } else { u.searchParams.delete("srv"); u.searchParams.delete("tok"); u.searchParams.set("local", ""); }
  location.href = u.toString();
};
srvLabel(); if (SRV) srvSync();
showView("main"); clampLev();
setInst(inst);
if (Q.has("grid")) setSix(true);
